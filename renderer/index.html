<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Regente</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="drag-region"></div>
      <div class="side-item" id="dash-item">
        <span class="side-icon">◍</span>
        <span class="side-name">Dashboard</span>
        <span class="attn-badge hidden" id="dash-attn"></span>
      </div>
      <div class="side-section">Workspaces</div>
      <div id="ws-list"></div>
      <button id="ws-add" class="ghost-btn">＋ Workspace</button>
      <div id="side-footer">
        <button id="settings-btn" class="ghost-btn" title="Atalhos, terminal, agentes e hooks (⌘,)">⚙ Ajustes</button>
        <div id="port-label"></div>
      </div>
    </aside>
    <main id="main">
      <header id="main-header">
        <div>
          <h1 id="view-title"></h1>
          <div id="view-subtitle"></div>
        </div>
        <div id="header-actions">
          <button id="term-add" class="primary-btn">＋ Terminal</button>
        </div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <div id="modal-root" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
